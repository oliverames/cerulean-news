name: Publish Cerulean News

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rescore_sentiment:
        description: "Re-score sentiment on every brand item (after a rubric change)"
        type: boolean
        default: false
      rejudge_all:
        description: "Re-judge relevance and summaries on every item"
        type: boolean
        default: false
      summary_max_requests:
        description: "Gemini requests this run (10 items each). Raise to sweep the archive in one pass."
        type: string
        default: ""
      backfill_after:
        description: "Backfill gap start, YYYY-MM-DD. With backfill_before, sweeps only those days."
        type: string
        default: ""
      backfill_before:
        description: "Backfill gap end, YYYY-MM-DD (exclusive). Both dates required, or neither."
        type: string
        default: ""
  schedule:
    # Every 30 minutes. The repo went public on 2026-09-23, so scheduled runs
    # use the unlimited free public-repo minutes and no longer draw on the
    # 3,000-minute Pro allowance. Cadence was every 4 hours while private
    # (tightened from 3 hours on 2026-09-16). Use the "Run workflow" button
    # for an immediate refresh.
    - cron: "17,47 * * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# Serialize runs instead of cancelling: a cancelled run wastes its Gemini
# summary calls (they're only persisted on deploy), and two overlapping
# runs could each seed from the same stale live feed and drop the other's
# items. Queued runs are fine at this cadence.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Runs are serialized (cancel-in-progress: false), so without a timeout a
    # hung build would hold the queue for GitHub's 360-minute default and back
    # up hours of scheduled runs. A healthy run finishes well under 30 minutes.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # This workflow never pushes back to the repo; don't leave the
          # workflow token in .git/config for later steps to read.
          persist-credentials: false
          fetch-depth: 0

      - name: Decide generation mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          sha="${{ github.sha }}"
          if ! changed="$(git diff --name-only "$before" "$sha" 2>/dev/null)"; then
            echo "::warning::Could not compare the complete push range; using a full generation."
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          printf '%s\n' "$changed"

          if [ -z "$changed" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -Eq '^(src/|test/|data/|certs/|package(-lock)?\.json$|\.github/workflows/publish-feed\.yml$)'; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The live feed-audit.json is the durable archive and summary cache.
      # Seed it before generating so stories persist across runs and items are
      # only summarized once (keeps Gemini usage far under free-tier quotas).
      # LIVE_SITE_URL is the Pages project's own hostname, which resolves no
      # matter what state the custom domain is in. SITE_URL (the public name
      # used for feed self-links) is deliberately not used here: a DNS change
      # on the custom domain must not stop the archive from seeding.
      - name: Seed archive from live feed
        env:
          LIVE_SITE_URL: https://bluenews-7g0.pages.dev
        run: |
          set -euo pipefail
          mkdir -p site

          # Download to a temp file and require it to parse as JSON before
          # replacing the checked-out archive: a truncated or garbled
          # download must not become the seed (loadPreviousState would treat
          # it as "no archive" and the deploy would shrink the live history).
          seed() {
            local url="$1" label="$2"
            if curl -fsSL --compressed --retry 3 --retry-delay 5 --max-time 60 "$url" -o /tmp/seed.json \
              && jq -e '
                .audit == true and
                (.items | type == "array") and
                (.sources | type == "array") and
                (.crawlState | type == "object")
              ' /tmp/seed.json > /dev/null 2>&1; then
              mv /tmp/seed.json site/feed-audit.json
              echo "Seeded archive from $label"
              return 0
            fi
            return 1
          }

          seed "$LIVE_SITE_URL/feed-audit.json" "live audit feed" \
            || { echo "::error::Durable live audit unavailable; refusing to replace it with a public or stale seed"; exit 1; }

      # The media tracker seed is the communications team's hand-kept clip
      # log and is not committed (it was scrubbed from history 2026-09-03).
      # It lives in the MEDIA_TRACKER_SEED_B64 secret as gzip + base64 and is
      # materialized here for the "Media Tracker Backfill" source.
      - name: Materialize media tracker seed
        if: steps.mode.outputs.full == 'true'
        env:
          MEDIA_TRACKER_SEED_B64: ${{ secrets.MEDIA_TRACKER_SEED_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$MEDIA_TRACKER_SEED_B64" ]; then
            # Warn rather than fail: without the file the backfill source
            # fails and alerts on its own, and the rest of the run still
            # deploys. Archived tracker items persist in the live audit.
            echo "::warning::MEDIA_TRACKER_SEED_B64 secret is missing; skipping the backfill seed"
            exit 0
          fi
          mkdir -p data
          printf '%s' "$MEDIA_TRACKER_SEED_B64" | base64 -d | gunzip > data/media-tracker-seed.json
          jq -e '.articles | length > 100' data/media-tracker-seed.json > /dev/null
          echo "Seed has $(jq '.articles | length' data/media-tracker-seed.json) articles"

      - name: Generate feed
        if: steps.mode.outputs.full == 'true'
        env:
          SITE_URL: https://cerulean.news
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Shadow is the first rollout stage. Missing credentials are reported
          # explicitly in the run log and audit metrics; publishing continues.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_RELEVANCE: ${{ vars.JEV_RELEVANCE || 'shadow' }}
          JEV_ENFORCE_AFTER: ${{ vars.JEV_ENFORCE_AFTER || 'pending' }}
          JEV_ALIGNMENT_PROFILE: src/rubrics/editorial-alignment-v1.json
          JEV_RELEVANCE_MAX_ITEMS: ${{ vars.JEV_RELEVANCE_MAX_ITEMS || '25' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # One-shot re-passes, opt-in from the Actions "Run workflow" dialog.
          # Both cost Gemini calls proportional to the archive, so they are
          # never set on the scheduled run.
          SUMMARY_RESCORE_SENTIMENT: ${{ inputs.rescore_sentiment }}
          SUMMARY_REJUDGE_ALL: ${{ inputs.rejudge_all }}
          # Empty on scheduled runs, so the default cap applies there.
          SUMMARY_MAX_REQUESTS_PER_RUN: ${{ inputs.summary_max_requests }}
          # A stall leaves days that no later run can reach: Google News search
          # ranks by recency and each source keeps only its newest maxItems, so
          # the stalled days are crowded out of every `when:30d` result for
          # good. Setting both dates swaps that rolling window for explicit
          # bounds and sweeps just the hole. Empty on scheduled runs.
          BACKFILL_AFTER: ${{ inputs.backfill_after }}
          BACKFILL_BEFORE: ${{ inputs.backfill_before }}
          # A backfill exists to re-ask the same sources a different question,
          # so the per-source freshness cache is exactly wrong for it: the
          # first working sweep reused 20 cached responses and queried only 76
          # of 97 sources. Disable the cap for backfill runs only; scheduled
          # runs keep it, since there it is what stops every run refetching
          # feeds that have not changed.
          RSS_CACHE_FRESHNESS_CAP_MS: ${{ (inputs.backfill_after != '' && inputs.backfill_before != '') && '0' || '' }}
          RSS_GLOBAL_CACHE_FRESHNESS_CAP_MS: ${{ (inputs.backfill_after != '' && inputs.backfill_before != '') && '0' || '' }}
          # www.bcbs.com serves an incomplete TLS chain (leaf only, no
          # DigiCert intermediate). Browsers recover via AIA fetching but
          # Node deliberately does not, so every fetch failed with
          # UNABLE_TO_VERIFY_LEAF_SIGNATURE. The missing intermediate,
          # taken from DigiCert's own CA issuers endpoint, completes the
          # chain; see WORKLOG 2026-08-25.
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/certs/digicert-global-g2-tls-rsa-sha256-2020-ca1.pem
        run: npm run generate

      # A static-only change deploys whatever is in site/, and the seed step
      # above refreshes only feed-audit.json. The committed feed.json and
      # feed.rss are build artefacts that go stale the moment a scheduled run
      # publishes, so deploying them republishes an old feed: a docs-only
      # commit on 2026-08-27 rolled the live reader back to a June 12 archive
      # of 129 items. Pull both reader-facing files from the live site too,
      # and fail the run rather than deploy a stale one.
      - name: Reuse live feed for static deploy
        if: steps.mode.outputs.full != 'true'
        env:
          LIVE_SITE_URL: https://bluenews-7g0.pages.dev
        run: |
          set -euo pipefail

          fetch_live() {
            local name="$1" check="$2"
            if curl -fsSL --compressed --retry 3 --retry-delay 5 --max-time 60 \
                 "$LIVE_SITE_URL/$name" -o "/tmp/$name"; then
              if [ "$check" = "json" ]; then
                jq -e '.items | type == "array"' "/tmp/$name" > /dev/null
              else
                grep -q "</rss>" "/tmp/$name"
              fi
              mv "/tmp/$name" "site/$name"
              echo "Reused live $name"
              return 0
            fi
            return 1
          }

          # Without this the deploy silently republishes a stale artefact,
          # which is worse than a failed run: nobody notices a green tick.
          fetch_live feed.json json
          fetch_live feed.rss rss

      # The site moved from GitHub Pages to Cloudflare Pages on 2026-09-03 so
      # the repo could go private (GitHub Free only serves Pages from a public
      # repo). Direct upload from the runner; the custom domain cerulean.news
      # is attached to the "bluenews" project in the Cloudflare dashboard.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy ./site \
            --project-name bluenews \
            --branch main \
            --commit-hash "${{ github.sha }}" \
            --commit-dirty=true
