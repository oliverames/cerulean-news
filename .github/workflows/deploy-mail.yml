# Deploys the email subscription Worker in mail/. Dispatch only: nothing here
# runs on a push or a schedule. Setup steps and the token permissions this
# needs are in mail/README.md.
name: Deploy mail Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mail
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mail

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Refuse to deploy with the placeholder database id
        run: |
          if grep -q REPLACE_WITH_D1_DATABASE_ID wrangler.toml; then
            echo "::error::mail/wrangler.toml still has the placeholder database_id. Create the D1 database and paste its id first (mail/README.md, step 3)."
            exit 1
          fi

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply cerulean-news-mail --remote

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
