<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found | Cerulean News</title>
    <!-- Cloudflare Pages serves this with a 404 status for any unknown path.
         Without a top-level 404.html, Pages treats the site as a single-page
         app and answers every unknown path with the homepage and a 200, which
         search engines report as soft 404s and duplicate homepages. -->
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <meta name="theme-color" content="#0033a0">
    <style>
      body {
        margin: 0;
        background: #fff;
        color: #111;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.45;
      }
      .page {
        max-width: 560px;
        margin: 0 auto;
        padding: 18px 16px 48px;
      }
      h1 {
        font-size: 1.6rem;
        margin: 24px 0 8px;
      }
      a { color: #0000cc; }
      a:visited { color: #551a8b; }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>Page not found</h1>
      <p>There is nothing at this address on Cerulean News.</p>
      <ul>
        <li><a href="/">Latest Vermont health care and health insurance news</a></li>
        <li><a href="/trends">Coverage trends</a></li>
        <li><a href="/feed.rss">RSS feed</a> or <a href="/feed.json">JSON feed</a></li>
      </ul>
    </main>
  </body>
</html>
